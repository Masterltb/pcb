services:
  mqtt:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./demo/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [demo]

  simulator:
    build: .
    command: ["python", "demo_simulator.py"]
    environment:
      FV_MQTT_HOST: mqtt
      FV_MQTT_PORT: "1883"
      FV_DEVICE_ID: rev-s3-s1-bench-01
    depends_on: [mqtt]
    networks: [demo]

  dashboard:
    build: .
    command: ["python", "server.py"]
    environment:
      FV_MQTT_HOST: mqtt
      FV_MQTT_PORT: "1883"
      FV_MQTT_TLS: "0"
      FV_DEVICE_ID: rev-s3-s1-bench-01
      FV_ADMIN_TOKEN: ${FV_ADMIN_TOKEN:-freshvend-demo-admin-token-change-me}
      FV_DASHBOARD_HOST: 0.0.0.0
      FV_DASHBOARD_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    depends_on: [mqtt]
    networks: [demo]

networks:
  demo:
    driver: bridge
