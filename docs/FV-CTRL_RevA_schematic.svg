<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:18px;font-weight:bold}.s{font-size:14px}.n{font-size:12px}.b{fill:#f8fbff;stroke:#2563a8;stroke-width:2}.p{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.l{stroke:#334155;stroke-width:2;fill:none}.g{stroke:#15803d;stroke-width:3;fill:none}.r{stroke:#b91c1c;stroke-width:3;fill:none}</style>
<rect width="1400" height="850" fill="white"/><text x="40" y="45" class="t">FV-CTRL Rev A — Sơ đồ khối / schematic draft</text><text x="40" y="70" class="n">12 V input • 4 × MG996R 360° • 2 cột, interlock firmware • két nước ngoài phạm vi PCB</text>
<rect x="45" y="150" width="170" height="110" rx="8" class="p"/><text x="65" y="185" class="t">J1 12 V IN</text><text x="65" y="210" class="s">terminal tháo rời</text><text x="65" y="233" class="s">+12V_IN / GND</text>
<rect x="280" y="135" width="210" height="140" rx="8" class="p"/><text x="300" y="170" class="t">Bảo vệ nguồn</text><text x="300" y="198" class="s">F1 cầu chì 5 A</text><text x="300" y="220" class="s">Q1 chống ngược cực</text><text x="300" y="242" class="s">D1 TVS → +12V</text>
<path d="M215 205H280" class="r"/><text x="225" y="195" class="n">+12 V</text>
<rect x="560" y="95" width="200" height="110" rx="8" class="p"/><text x="580" y="130" class="t">Buck A XL4015</text><text x="580" y="156" class="s">12 V → 6.0 V, ≥5 A</text><text x="580" y="180" class="s">Rail +6V_A / cột 1</text>
<rect x="560" y="245" width="200" height="110" rx="8" class="p"/><text x="580" y="280" class="t">Buck B XL4015</text><text x="580" y="306" class="s">12 V → 6.0 V, ≥5 A</text><text x="580" y="330" class="s">Rail +6V_B / cột 2</text>
<rect x="560" y="405" width="200" height="110" rx="8" class="b"/><text x="580" y="440" class="t">Buck C 5 V</text><text x="580" y="466" class="s">logic + IR TX</text><text x="580" y="490" class="s">rail +5V</text>
<path d="M490 185H560M490 205V300H560M490 225V460H560" class="r"/><text x="495" y="120" class="n">+12 V sau bảo vệ</text>
<rect x="850" y="75" width="210" height="150" rx="8" class="b"/><text x="875" y="110" class="t">Servo cột 1</text><text x="875" y="138" class="s">PTC + 1000–2200 µF</text><text x="875" y="163" class="s">J_S1_TOP, J_S1_BOT</text><text x="875" y="188" class="s">PWM: 330 Ω + 10 kΩ↓</text>
<rect x="850" y="255" width="210" height="150" rx="8" class="b"/><text x="875" y="290" class="t">Servo cột 2</text><text x="875" y="318" class="s">PTC + 1000–2200 µF</text><text x="875" y="343" class="s">J_S2_TOP, J_S2_BOT</text><text x="875" y="368" class="s">PWM: 330 Ω + 10 kΩ↓</text>
<path d="M760 150H850M760 300H850" class="g"/><text x="775" y="143" class="n">+6V_A</text><text x="775" y="292" class="n">+6V_B</text>
<rect x="850" y="475" width="255" height="210" rx="8" class="b"/><text x="875" y="510" class="t">ESP32 DevKit 38 pin</text><text x="875" y="538" class="s">GPIO16/17: S1 TOP/BOT</text><text x="875" y="562" class="s">GPIO18/19: S2 TOP/BOT</text><text x="875" y="586" class="s">GPIO23: IR TX 38 kHz burst</text><text x="875" y="610" class="s">GPIO34/35: IR RX1/RX2</text><text x="875" y="634" class="s">GPIO25/26/27/32: limit DNP</text><text x="875" y="658" class="s">GPIO21/22: I²C dự phòng</text>
