<rect x="1160" y="355" width="190" height="120" rx="8" class="b"/><text x="1180" y="390" class="t">Limit switch</text><text x="1180" y="418" class="s">4 × JST-XH, DNP</text><text x="1180" y="442" class="s">10 kΩ pull-up + 100 nF</text>
<path d="M1060 175H1160M1060 415H1160M955 475V405" class="l"/><text x="1080" y="168" class="n">IR TX/RX</text><text x="1080" y="408" class="n">LS1…LS4</text>
<text x="45" y="780" class="s">GND chung copper pour. Mỗi cột firmware chỉ cho một servo chạy đồng thời. Chưa layout: cần số đo XL4015, ESP32 và khoang PCB.</text>
